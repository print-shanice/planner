name: checks

# every branch and pull request runs the same checks main does before it deploys:
# the unit tests, the end-to-end tests on a phone and a laptop, and the build
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # Keep in sync with @playwright/test in package-lock.json and deploy.yml.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - run: npm run build
